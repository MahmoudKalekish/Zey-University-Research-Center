services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research_center
    ports: ["5432:5432"]
    volumes: [research_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_center"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  research_data:
